<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obsidian Notebook Reader — iPad Simulation Preview</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #dcd8cc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .preview-shell {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
      }
      .preview-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 14px;
        background: #232722;
        color: #f3f1e9;
        font-size: 12px;
        flex-shrink: 0;
      }
      .preview-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .preview-controls button {
        border: 1px solid #596357;
        background: #30352f;
        color: #f3f1e9;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .preview-controls button[aria-pressed="true"] {
        background: #4c6b49;
        border-color: #8fb184;
      }
      #obsidian-mount {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      #obsidian-mount > .view-container {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div class="preview-shell">
      <div class="preview-banner">
        <span>Simulated Obsidian Host (Browser Harness — not live Obsidian/iPadOS)</span>
        <div class="preview-controls">
          <button type="button" data-scenario="rich" aria-pressed="true">Rich Vault (Short + Long + Daily)</button>
          <button type="button" data-scenario="large" aria-pressed="false">Large Vault (120 notes)</button>
          <button type="button" data-scenario="empty" aria-pressed="false">Empty Browsing Set</button>
          <button type="button" id="toggle-theme">Dark Mode</button>
        </div>
      </div>
      <main id="obsidian-mount"></main>
    </div>
    <script src="./bundle.js"></script>
  </body>
</html>
